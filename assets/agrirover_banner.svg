<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <radialGradient id="vignette-agri" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#111B14" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#0A110C" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050906" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="gold-agri" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9B7732"/>
    </linearGradient>
    <style>
      .serif-title { font-family: 'Cinzel', 'Cormorant Garamond', 'Didot', 'Playfair Display', 'Baskerville', 'Georgia', serif; font-weight: 400; }
      .serif-sub { font-family: 'Cormorant Garamond', 'Baskerville', 'Georgia', serif; font-style: italic; }
      .mono-tech { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    </style>
  </defs>

  <rect width="1200" height="420" fill="#050906"/>
  <rect width="1200" height="420" fill="url(#vignette-agri)"/>

  <!-- Frame -->
  <rect x="24" y="24" width="1152" height="372" fill="none" stroke="#C5A059" stroke-width="0.75" stroke-opacity="0.35"/>
  <rect x="28" y="28" width="1144" height="364" fill="none" stroke="#C5A059" stroke-width="0.5" stroke-dasharray="4,6" stroke-opacity="0.2"/>

  <!-- Corner Rosettes -->
  <g stroke="#C5A059" stroke-width="0.8" opacity="0.6">
    <path d="M20 24 h16 M24 20 v16"/>
    <path d="M1180 24 h-16 M1176 20 v16"/>
    <path d="M20 396 h16 M24 392 v16"/>
    <path d="M1180 396 h-16 M1176 392 v16"/>
    <circle cx="24" cy="24" r="3" fill="none"/>
    <circle cx="1176" cy="24" r="3" fill="none"/>
    <circle cx="24" cy="396" r="3" fill="none"/>
    <circle cx="1176" cy="396" r="3" fill="none"/>
  </g>

  <!-- Da Vinci Autonomous Rover Chassis & Soil Telemetry Blueprint (Left Visual) -->
  <g transform="translate(225, 210)" stroke="#C5A059" fill="none">
    <g stroke-width="0.4" stroke-opacity="0.15" stroke-dasharray="2,4">
      <circle cx="0" cy="0" r="165"/>
      <circle cx="0" cy="0" r="120"/>
      <circle cx="0" cy="0" r="75"/>
      <line x1="-180" y1="0" x2="180" y2="0"/>
      <line x1="0" y1="-160" x2="0" y2="160"/>
    </g>

    <!-- Rover Chassis Geometric Wireframe -->
    <rect x="-85" y="-55" width="170" height="110" rx="6" stroke="url(#gold-agri)" stroke-width="1.2" fill="#0C150F" fill-opacity="0.8"/>
    
    <!-- Rover Wheels -->
    <rect x="-95" y="-70" width="30" height="20" rx="3" stroke="#C5A059" stroke-width="0.8" fill="#132018"/>
    <rect x="65" y="-70" width="30" height="20" rx="3" stroke="#C5A059" stroke-width="0.8" fill="#132018"/>
    <rect x="-95" y="50" width="30" height="20" rx="3" stroke="#C5A059" stroke-width="0.8" fill="#132018"/>
    <rect x="65" y="50" width="30" height="20" rx="3" stroke="#C5A059" stroke-width="0.8" fill="#132018"/>

    <!-- Sensor Mast & Ultrasonic Arc -->
    <circle cx="0" cy="0" r="18" stroke="#10B981" stroke-width="1"/>
    <path d="M-30,-25 Q0,-45 30,-25" stroke="#10B981" stroke-width="0.8" stroke-dasharray="2,2"/>
    <path d="M-50,-40 Q0,-70 50,-40" stroke="#10B981" stroke-width="0.6" stroke-dasharray="3,3"/>

    <text x="-165" y="-140" fill="#C5A059" opacity="0.45" font-size="9" class="mono-tech">FIG. XII — TELEMETRIC ROVER</text>
    <text x="-165" y="145" fill="#C5A059" opacity="0.4" font-size="8" class="mono-tech">ESP8266 / ARDUINO CORE</text>
    <text x="-165" y="160" fill="#10B981" opacity="0.5" font-size="8" class="mono-tech">REAL-TIME SOIL MOISTURE CLOUD</text>
  </g>

  <!-- Typography (Center-Right) -->
  <g transform="translate(465, 0)">
    <text x="0" y="125" fill="#C5A059" font-size="11" letter-spacing="4" class="serif-title" opacity="0.85">
      AGRICULTURAL ROBOTICS &amp; IOT TELEMETRY PIPELINE
    </text>

    <text x="0" y="185" fill="#FDFBF7" font-size="44" letter-spacing="8" class="serif-title">
      AGRIROVER - IOT
    </text>

    <g transform="translate(0, 210)" stroke="#C5A059" opacity="0.6">
      <line x1="0" y1="0" x2="420" y2="0" stroke-width="0.8"/>
      <circle cx="210" cy="0" r="3" fill="#C5A059"/>
      <circle cx="105" cy="0" r="1.5" fill="#C5A059"/>
      <circle cx="315" cy="0" r="1.5" fill="#C5A059"/>
    </g>

    <text x="0" y="245" fill="#C5BEB3" font-size="14" letter-spacing="2" class="serif-title" opacity="0.9">
      ESP8266 • SOIL SENSORS • AUTONOMOUS OBSTACLE AVOIDANCE
    </text>

    <text x="0" y="275" fill="#8C857B" font-size="13" class="serif-sub">
      Microcontroller edge sensing streaming real-time soil moisture and environmental metrics to cloud telemetry.
    </text>

    <g transform="translate(0, 315)">
      <rect x="0" y="0" width="130" height="24" rx="2" fill="#0D1912" stroke="#C5A059" stroke-width="0.6" stroke-opacity="0.4"/>
      <text x="65" y="16" fill="#C5A059" font-size="10" text-anchor="middle" class="mono-tech">ESP8266 / C++</text>

      <rect x="142" y="0" width="135" height="24" rx="2" fill="#0D1912" stroke="#C5A059" stroke-width="0.6" stroke-opacity="0.4"/>
      <text x="209" y="16" fill="#10B981" font-size="10" text-anchor="middle" class="mono-tech">SOIL MOISTURE</text>

      <rect x="289" y="0" width="145" height="24" rx="2" fill="#0D1912" stroke="#C5A059" stroke-width="0.6" stroke-opacity="0.4"/>
      <text x="361" y="16" fill="#38BDF8" font-size="10" text-anchor="middle" class="mono-tech">CLOUD DASHBOARD</text>
    </g>

    <text x="0" y="365" fill="#5C564E" font-size="9" letter-spacing="2" class="mono-tech">
      EX AGRI TELLUS • ANNO MMXXVI • OPEN AGRI-TECH
    </text>
  </g>
</svg>